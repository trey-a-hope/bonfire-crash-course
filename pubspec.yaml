name: bonfire_crash_course
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  fluent_ui: ^4.16.1
  flutter_dartpad: ^0.0.3
  flutter_highlight: ^0.7.0
  gap: ^3.0.1
  macos_ui: ^2.2.2
  media_kit: ^1.2.6
  media_kit_libs_macos_video: ^1.1.4
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.1
  signals: ^7.1.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.2
  webview_flutter: ^4.7.0
  lottie: ^3.5.1
  go_router: ^18.0.1
  msix: ^3.16.8
  media_kit_libs_windows_video: ^1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/videos/flight.mp4
    - assets/images/screenshots/2/run_app.png

flutter_launcher_icons:
  ios: true
  image_path: "assets/app_icon.png"
  macos:
    generate: true
    image_path: "assets/app_icon.png"
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 48

msix_config:
  display_name: Bonfire Crash Course
  publisher_display_name: Trey Hope
  identity_name: com.io.bonfire-crash-course
  logo_path: assets/app_icon.png
