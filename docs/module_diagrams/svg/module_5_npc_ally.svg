<svg viewBox="0 0 1070 930" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="475" y1="82" x2="185" y2="106" marker-end="url(#ah)"/><line class="arr" x1="535" y1="82" x2="535" y2="106" marker-end="url(#ah)"/><line class="arr" x1="595" y1="82" x2="885" y2="106" marker-end="url(#ah)"/><line class="arr" x1="360" y1="622" x2="360" y2="772" marker-end="url(#ah)" stroke-dasharray="5 4"/><line class="arr" x1="710" y1="738" x2="710" y2="772" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="th" x="535" y="22" text-anchor="middle">Module 5: NPC (Ally) (badge: COMPANION ARCHITECT)</text><text class="ts" x="20" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="720" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="195" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="545" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="535" y="790" text-anchor="middle">WHAT STUDENTS FINISH WITH</text><g class="c-amber"><rect x="410" y="38" width="250" height="44" rx="8"/><text class="th" x="535" y="58" text-anchor="middle">NPC (Ally)</text><text class="ts" x="535" y="77" text-anchor="middle">Add a friendly character</text></g><g class="c-blue"><rect x="20" y="108" width="330" height="46" rx="8"/><text class="th" x="185" y="128" text-anchor="middle">Lesson 1: Creating the Companion Component</text><text class="ts" x="185" y="147" text-anchor="middle">A SimpleAlly added to the world</text></g><g class="c-amber"><rect x="20" y="184" width="330" height="50" rx="8"/><text class="th" x="32" y="204" text-anchor="start">Ally</text><text class="ts" x="32" y="223" text-anchor="start">An NPC on the player's side, with life</text></g><g class="c-amber"><rect x="20" y="242" width="330" height="50" rx="8"/><text class="th" x="32" y="262" text-anchor="start">SimpleAlly</text><text class="ts" x="32" y="281" text-anchor="start">No PlatformAlly in Bonfire 4.0</text></g><g class="c-amber"><rect x="20" y="300" width="330" height="50" rx="8"/><text class="th" x="32" y="320" text-anchor="start">components</text><text class="ts" x="32" y="339" text-anchor="start">Everything in the world but the player</text></g><g class="c-blue"><rect x="370" y="108" width="330" height="46" rx="8"/><text class="th" x="535" y="128" text-anchor="middle">Lesson 2: Companion Sprite Animations</text><text class="ts" x="535" y="147" text-anchor="middle">Strawberry idle and walk sheets</text></g><g class="c-amber"><rect x="370" y="184" width="330" height="50" rx="8"/><text class="th" x="382" y="204" text-anchor="start">SimpleDirectionAnimation</text><text class="ts" x="382" y="223" text-anchor="start">Idle and run animations per direction</text></g><g class="c-amber"><rect x="370" y="242" width="330" height="50" rx="8"/><text class="th" x="382" y="262" text-anchor="start">Frame Count (amount)</text><text class="ts" x="382" y="281" text-anchor="start">Idle is 8 frames, walk is 4</text></g><g class="c-blue"><rect x="720" y="108" width="330" height="46" rx="8"/><text class="th" x="885" y="128" text-anchor="middle">Lesson 3: Gravity and Collision</text><text class="ts" x="885" y="147" text-anchor="middle">Stand on the map, stop at walls</text></g><g class="c-amber"><rect x="720" y="184" width="330" height="50" rx="8"/><text class="th" x="732" y="204" text-anchor="start">WithCollision</text><text class="ts" x="732" y="223" text-anchor="start">Stops moving when it hits something</text></g><g class="c-amber"><rect x="720" y="242" width="330" height="50" rx="8"/><text class="th" x="732" y="262" text-anchor="start">WithForces</text><text class="ts" x="732" y="281" text-anchor="start">Same gravity as the hero</text></g><g class="c-amber"><rect x="720" y="300" width="330" height="50" rx="8"/><text class="th" x="732" y="320" text-anchor="start">RectangleHitbox</text><text class="ts" x="732" y="339" text-anchor="start">The companion's solid shape</text></g><g class="c-blue"><rect x="195" y="380" width="330" height="46" rx="8"/><text class="th" x="360" y="400" text-anchor="middle">Lesson 4: Companion Dialogue</text><text class="ts" x="360" y="419" text-anchor="middle">Talk when the hero comes close</text></g><g class="c-amber"><rect x="195" y="456" width="330" height="50" rx="8"/><text class="th" x="207" y="476" text-anchor="start">vision.seePlayer</text><text class="ts" x="207" y="495" text-anchor="start">Is the hero within 48 px?</text></g><g class="c-amber"><rect x="195" y="514" width="330" height="50" rx="8"/><text class="th" x="207" y="534" text-anchor="start">TalkDialog and Say</text><text class="ts" x="207" y="553" text-anchor="start">Built-in dialogue box, line by line</text></g><g class="c-amber"><rect x="195" y="572" width="330" height="50" rx="8"/><text class="th" x="207" y="592" text-anchor="start">pauseEngine / resumeEngine</text><text class="ts" x="207" y="611" text-anchor="start">Freeze the game while it talks</text></g><g class="c-blue"><rect x="545" y="380" width="330" height="46" rx="8"/><text class="th" x="710" y="400" text-anchor="middle">Lesson 5: Make Berry Wave and Follow the Hero</text><text class="ts" x="710" y="419" text-anchor="middle">Wave hello, then tag along</text></g><g class="c-amber"><rect x="545" y="456" width="330" height="50" rx="8"/><text class="th" x="557" y="476" text-anchor="start">FollowAction and followAction</text><text class="ts" x="557" y="495" text-anchor="start">Stop, lost, left or right each tick</text></g><g class="c-amber"><rect x="545" y="514" width="330" height="50" rx="8"/><text class="th" x="557" y="534" text-anchor="start">canMove, moveLeft and moveRight</text><text class="ts" x="557" y="553" text-anchor="start">Walk on the ground, wait at walls</text></g><g class="c-amber"><rect x="545" y="572" width="330" height="50" rx="8"/><text class="th" x="557" y="592" text-anchor="start">onBlockMovementListener</text><text class="ts" x="557" y="611" text-anchor="start">Pass through the hero, not tiles</text></g><g class="c-amber"><rect x="545" y="630" width="330" height="50" rx="8"/><text class="th" x="557" y="650" text-anchor="start">priority (draw order)</text><text class="ts" x="557" y="669" text-anchor="start">Always drawn just behind the hero</text></g><g class="c-amber"><rect x="545" y="688" width="330" height="50" rx="8"/><text class="th" x="557" y="708" text-anchor="start">Two waves</text><text class="ts" x="557" y="727" text-anchor="start">Hello in the portrait, goodbye in the world</text></g><g class="c-green"><rect x="20" y="802" width="330" height="50" rx="8"/><text class="th" x="185" y="822" text-anchor="middle">Companion Component</text><text class="ts" x="185" y="841" text-anchor="middle">A SimpleAlly in the game world</text></g><g class="c-green"><rect x="370" y="802" width="330" height="50" rx="8"/><text class="th" x="535" y="822" text-anchor="middle">Sprite Animations</text><text class="ts" x="535" y="841" text-anchor="middle">Strawberry idle and walk sheets</text></g><g class="c-green"><rect x="720" y="802" width="330" height="50" rx="8"/><text class="th" x="885" y="822" text-anchor="middle">Hitbox &amp; Collision</text><text class="ts" x="885" y="841" text-anchor="middle">Stands on the map, stops at walls</text></g><g class="c-green"><rect x="195" y="860" width="330" height="50" rx="8"/><text class="th" x="360" y="880" text-anchor="middle">Dialogue &amp; Interaction</text><text class="ts" x="360" y="899" text-anchor="middle">Talks once when the hero comes close</text></g><g class="c-green"><rect x="545" y="860" width="330" height="50" rx="8"/><text class="th" x="710" y="880" text-anchor="middle">Wave &amp; Follow</text><text class="ts" x="710" y="899" text-anchor="middle">Waves hello, then follows the hero</text></g></svg>