<svg viewBox="0 0 720 426" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="360" y1="82" x2="360" y2="106" marker-end="url(#ah)"/><line class="arr" x1="360" y1="234" x2="360" y2="268" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="th" x="360" y="22" text-anchor="middle">Module 5: NPC (Ally) (badge: COMPANION ARCHITECT)</text><text class="ts" x="195" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="360" y="286" text-anchor="middle">WHAT STUDENTS FINISH WITH</text><g class="c-amber"><rect x="235" y="38" width="250" height="44" rx="8"/><text class="th" x="360" y="58" text-anchor="middle">NPC (Ally)</text><text class="ts" x="360" y="77" text-anchor="middle">Add a friendly character</text></g><g class="c-blue"><rect x="195" y="108" width="330" height="46" rx="8"/><text class="th" x="360" y="128" text-anchor="middle">Lesson 1: Creating the NPC Component</text><text class="ts" x="360" y="147" text-anchor="middle">Sprites, idle animation and hitbox</text></g><g class="c-amber"><rect x="195" y="184" width="330" height="50" rx="8"/><text class="th" x="207" y="204" text-anchor="start">Player Component</text><text class="ts" x="207" y="223" text-anchor="start">Extends SimplePlayer: sprites, anim, hitbox</text></g><g class="c-green"><rect x="20" y="298" width="330" height="50" rx="8"/><text class="th" x="185" y="318" text-anchor="middle">NPC Component</text><text class="ts" x="185" y="337" text-anchor="middle">An interactive non-player character</text></g><g class="c-green"><rect x="370" y="298" width="330" height="50" rx="8"/><text class="th" x="535" y="318" text-anchor="middle">Sprite Animations</text><text class="ts" x="535" y="337" text-anchor="middle">Idle and movement sheets for the ally</text></g><g class="c-green"><rect x="20" y="356" width="330" height="50" rx="8"/><text class="th" x="185" y="376" text-anchor="middle">Hitbox &amp; Collision</text><text class="ts" x="185" y="395" text-anchor="middle">Collides with the world and the player</text></g><g class="c-green"><rect x="370" y="356" width="330" height="50" rx="8"/><text class="th" x="535" y="376" text-anchor="middle">Dialogue &amp; Interaction</text><text class="ts" x="535" y="395" text-anchor="middle">Proximity triggers and speech bubbles</text></g></svg>