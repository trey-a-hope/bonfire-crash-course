<svg viewBox="0 0 1070 872" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="475" y1="82" x2="185" y2="106" marker-end="url(#ah)"/><line class="arr" x1="535" y1="82" x2="535" y2="106" marker-end="url(#ah)"/><line class="arr" x1="595" y1="82" x2="885" y2="106" marker-end="url(#ah)"/><line class="arr" x1="360" y1="680" x2="360" y2="714" marker-end="url(#ah)" stroke-dasharray="5 4"/><line class="arr" x1="710" y1="680" x2="710" y2="714" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="th" x="535" y="22" text-anchor="middle">Module 5: Enemy (badge: ENEMY THWARPER)</text><text class="ts" x="20" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="720" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="195" y="506" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="545" y="506" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="535" y="732" text-anchor="middle">WHAT STUDENTS FINISH WITH</text><g class="c-amber"><rect x="410" y="38" width="250" height="44" rx="8"/><text class="th" x="535" y="58" text-anchor="middle">Enemy</text><text class="ts" x="535" y="77" text-anchor="middle">Add an enemy to fight</text></g><g class="c-blue"><rect x="20" y="108" width="330" height="46" rx="8"/><text class="th" x="185" y="128" text-anchor="middle">Lesson 1: Creating the Enemy Component</text><text class="ts" x="185" y="147" text-anchor="middle">A minor enemy beside the hero</text></g><g class="c-amber"><rect x="20" y="184" width="330" height="50" rx="8"/><text class="th" x="32" y="204" text-anchor="start">PlatformEnemy</text><text class="ts" x="32" y="223" text-anchor="start">The enemy twin of PlatformPlayer</text></g><g class="c-amber"><rect x="20" y="242" width="330" height="50" rx="8"/><text class="th" x="32" y="262" text-anchor="start">components</text><text class="ts" x="32" y="281" text-anchor="start">BonfireWidget's list for all but the player</text></g><g class="c-blue"><rect x="370" y="108" width="330" height="46" rx="8"/><text class="th" x="535" y="128" text-anchor="middle">Lesson 2: Apply Behavior</text><text class="ts" x="535" y="147" text-anchor="middle">Wander, then chase the hero</text></g><g class="c-amber"><rect x="370" y="184" width="330" height="50" rx="8"/><text class="th" x="382" y="204" text-anchor="start">UseBehavior</text><text class="ts" x="382" y="223" text-anchor="start">Runs a list of behaviors every frame</text></g><g class="c-amber"><rect x="370" y="242" width="330" height="50" rx="8"/><text class="th" x="382" y="262" text-anchor="start">BCondition</text><text class="ts" x="382" y="281" text-anchor="start">If this, do that; otherwise, do something else</text></g><g class="c-amber"><rect x="370" y="300" width="330" height="50" rx="8"/><text class="th" x="382" y="320" text-anchor="start">BSeeAndMoveToTarget</text><text class="ts" x="382" y="339" text-anchor="start">Chase the hero within 5 tiles</text></g><g class="c-amber"><rect x="370" y="358" width="330" height="50" rx="8"/><text class="th" x="382" y="378" text-anchor="start">BRandomMovement</text><text class="ts" x="382" y="397" text-anchor="start">Wander at random when no one is near</text></g><g class="c-blue"><rect x="720" y="108" width="330" height="46" rx="8"/><text class="th" x="885" y="128" text-anchor="middle">Lesson 3: Apply Lifebar</text><text class="ts" x="885" y="147" text-anchor="middle">Life and a bar over each character</text></g><g class="c-amber"><rect x="720" y="184" width="330" height="50" rx="8"/><text class="th" x="732" y="204" text-anchor="start">WithLifeBar</text><text class="ts" x="732" y="223" text-anchor="start">Draws a life bar over a character</text></g><g class="c-amber"><rect x="720" y="242" width="330" height="50" rx="8"/><text class="th" x="732" y="262" text-anchor="start">life</text><text class="ts" x="732" y="281" text-anchor="start">How much damage a character can take</text></g><g class="c-amber"><rect x="720" y="300" width="330" height="50" rx="8"/><text class="th" x="732" y="320" text-anchor="start">lifeBar.setup</text><text class="ts" x="732" y="339" text-anchor="start">Styles the life bar</text></g><g class="c-blue"><rect x="195" y="438" width="330" height="46" rx="8"/><text class="th" x="360" y="458" text-anchor="middle">Lesson 4: Respond to Hurt</text><text class="ts" x="360" y="477" text-anchor="middle">Flinch when an attack lands</text></g><g class="c-amber"><rect x="195" y="514" width="330" height="50" rx="8"/><text class="th" x="207" y="534" text-anchor="start">onMount</text><text class="ts" x="207" y="553" text-anchor="start">Runs once the component joins the game</text></g><g class="c-amber"><rect x="195" y="572" width="330" height="50" rx="8"/><text class="th" x="207" y="592" text-anchor="start">onReceiveDamageListener</text><text class="ts" x="207" y="611" text-anchor="start">Calls you back on every hit</text></g><g class="c-amber"><rect x="195" y="630" width="330" height="50" rx="8"/><text class="th" x="207" y="650" text-anchor="start">playOnceOther</text><text class="ts" x="207" y="669" text-anchor="start">Plays the hurt animation one time</text></g><g class="c-blue"><rect x="545" y="438" width="330" height="46" rx="8"/><text class="th" x="710" y="458" text-anchor="middle">Lesson 5: Respond to Die</text><text class="ts" x="710" y="477" text-anchor="middle">Fall when life reaches 0</text></g><g class="c-amber"><rect x="545" y="514" width="330" height="50" rx="8"/><text class="th" x="557" y="534" text-anchor="start">onDieListener</text><text class="ts" x="557" y="553" text-anchor="start">Calls you back when life hits 0</text></g><g class="c-amber"><rect x="545" y="572" width="330" height="50" rx="8"/><text class="th" x="557" y="592" text-anchor="start">pauseBehaviors</text><text class="ts" x="557" y="611" text-anchor="start">Turns off the AI</text></g><g class="c-amber"><rect x="545" y="630" width="330" height="50" rx="8"/><text class="th" x="557" y="650" text-anchor="start">removeFromParent</text><text class="ts" x="557" y="669" text-anchor="start">Takes the component out of the game</text></g><g class="c-green"><rect x="20" y="744" width="330" height="50" rx="8"/><text class="th" x="185" y="764" text-anchor="middle">Enemy Component</text><text class="ts" x="185" y="783" text-anchor="middle">A minor enemy stands on the map</text></g><g class="c-green"><rect x="370" y="744" width="330" height="50" rx="8"/><text class="th" x="535" y="764" text-anchor="middle">Enemy AI</text><text class="ts" x="535" y="783" text-anchor="middle">Wanders, then chases and strikes the hero</text></g><g class="c-green"><rect x="720" y="744" width="330" height="50" rx="8"/><text class="th" x="885" y="764" text-anchor="middle">Life Bars</text><text class="ts" x="885" y="783" text-anchor="middle">Red over the enemy, green over the hero</text></g><g class="c-green"><rect x="195" y="802" width="330" height="50" rx="8"/><text class="th" x="360" y="822" text-anchor="middle">Hurt Reactions</text><text class="ts" x="360" y="841" text-anchor="middle">A hurt animation on every hit</text></g><g class="c-green"><rect x="545" y="802" width="330" height="50" rx="8"/><text class="th" x="710" y="822" text-anchor="middle">Death</text><text class="ts" x="710" y="841" text-anchor="middle">Death animation, then gone from the game</text></g></svg>