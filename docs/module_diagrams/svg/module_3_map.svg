<svg viewBox="0 0 720 542" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="330" y1="82" x2="185" y2="106" marker-end="url(#ah)"/><line class="arr" x1="390" y1="82" x2="535" y2="106" marker-end="url(#ah)"/><line class="arr" x1="185" y1="350" x2="185" y2="384" marker-end="url(#ah)" stroke-dasharray="5 4"/><line class="arr" x1="535" y1="292" x2="535" y2="384" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="th" x="360" y="22" text-anchor="middle">Module 3: Map (badge: MAP ARCHITECT)</text><text class="ts" x="20" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="360" y="402" text-anchor="middle">WHAT STUDENTS FINISH WITH</text><g class="c-amber"><rect x="235" y="38" width="250" height="44" rx="8"/><text class="th" x="360" y="58" text-anchor="middle">Map</text><text class="ts" x="360" y="77" text-anchor="middle">Build the game world</text></g><g class="c-blue"><rect x="20" y="108" width="330" height="46" rx="8"/><text class="th" x="185" y="128" text-anchor="middle">Lesson 1: Loading the Map</text><text class="ts" x="185" y="147" text-anchor="middle">Render the Spritefusion tilemap</text></g><g class="c-amber"><rect x="20" y="184" width="330" height="50" rx="8"/><text class="th" x="32" y="204" text-anchor="start">BonfireWidget</text><text class="ts" x="32" y="223" text-anchor="start">Runs the game loop, camera and physics</text></g><g class="c-amber"><rect x="20" y="242" width="330" height="50" rx="8"/><text class="th" x="32" y="262" text-anchor="start">WorldMapBySpritefusion</text><text class="ts" x="32" y="281" text-anchor="start">Reads map.json: floor tiles + collision grid</text></g><g class="c-amber"><rect x="20" y="300" width="330" height="50" rx="8"/><text class="th" x="32" y="320" text-anchor="start">CameraConfig</text><text class="ts" x="32" y="339" text-anchor="start">Zoom fit, and keeps the camera in the map</text></g><g class="c-blue"><rect x="370" y="108" width="330" height="46" rx="8"/><text class="th" x="535" y="128" text-anchor="middle">Lesson 2: Custom Background</text><text class="ts" x="535" y="147" text-anchor="middle">Add a scrolling parallax sky</text></g><g class="c-amber"><rect x="370" y="184" width="330" height="50" rx="8"/><text class="th" x="382" y="204" text-anchor="start">GameBackground</text><text class="ts" x="382" y="223" text-anchor="start">Base class for ParallaxBackground</text></g><g class="c-amber"><rect x="370" y="242" width="330" height="50" rx="8"/><text class="th" x="382" y="262" text-anchor="start">ParallaxComponent</text><text class="ts" x="382" y="281" text-anchor="start">Layers at different speeds give depth</text></g><g class="c-green"><rect x="20" y="414" width="330" height="50" rx="8"/><text class="th" x="185" y="434" text-anchor="middle">Tilemap Integration</text><text class="ts" x="185" y="453" text-anchor="middle">Terrain and collision grid rendered</text></g><g class="c-green"><rect x="370" y="414" width="330" height="50" rx="8"/><text class="th" x="535" y="434" text-anchor="middle">Parallax Scenery</text><text class="ts" x="535" y="453" text-anchor="middle">Sky and clouds scroll with depth</text></g><g class="c-green"><rect x="20" y="472" width="330" height="50" rx="8"/><text class="th" x="185" y="492" text-anchor="middle">Camera Boundaries</text><text class="ts" x="185" y="511" text-anchor="middle">Camera clamped inside the map</text></g><g class="c-green"><rect x="370" y="472" width="330" height="50" rx="8"/><text class="th" x="535" y="492" text-anchor="middle">World Physics</text><text class="ts" x="535" y="511" text-anchor="middle">Collision obstacles stop falling off</text></g></svg>