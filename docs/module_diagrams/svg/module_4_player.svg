<svg viewBox="0 0 1070 872" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="475" y1="82" x2="185" y2="106" marker-end="url(#ah)"/><line class="arr" x1="535" y1="82" x2="535" y2="106" marker-end="url(#ah)"/><line class="arr" x1="595" y1="82" x2="885" y2="106" marker-end="url(#ah)"/><line class="arr" x1="185" y1="564" x2="185" y2="714" marker-end="url(#ah)" stroke-dasharray="5 4"/><line class="arr" x1="535" y1="506" x2="535" y2="714" marker-end="url(#ah)" stroke-dasharray="5 4"/><line class="arr" x1="885" y1="680" x2="885" y2="714" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="th" x="535" y="22" text-anchor="middle">Module 4: Player (badge: HERO CONTROLLER)</text><text class="ts" x="20" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="720" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="20" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="720" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="535" y="732" text-anchor="middle">WHAT STUDENTS FINISH WITH</text><g class="c-amber"><rect x="410" y="38" width="250" height="44" rx="8"/><text class="th" x="535" y="58" text-anchor="middle">Player</text><text class="ts" x="535" y="77" text-anchor="middle">Build and control the hero</text></g><g class="c-blue"><rect x="20" y="108" width="330" height="46" rx="8"/><text class="th" x="185" y="128" text-anchor="middle">Lesson 1: Creating the Player Component</text><text class="ts" x="185" y="147" text-anchor="middle">An animated side-scroller hero</text></g><g class="c-amber"><rect x="20" y="184" width="330" height="50" rx="8"/><text class="th" x="32" y="204" text-anchor="start">PlatformPlayer</text><text class="ts" x="32" y="223" text-anchor="start">Side-scroller hero: run, jump, face a side</text></g><g class="c-amber"><rect x="20" y="242" width="330" height="50" rx="8"/><text class="th" x="32" y="262" text-anchor="start">CharacterAsset</text><text class="ts" x="32" y="281" text-anchor="start">One enum holds a character's sprite paths</text></g><g class="c-amber"><rect x="20" y="300" width="330" height="50" rx="8"/><text class="th" x="32" y="320" text-anchor="start">SpriteAnimation</text><text class="ts" x="32" y="339" text-anchor="start">Sheet frames in order; stepTime sets speed</text></g><g class="c-blue"><rect x="370" y="108" width="330" height="46" rx="8"/><text class="th" x="535" y="128" text-anchor="middle">Lesson 2: Apply Gravity to Player</text><text class="ts" x="535" y="147" text-anchor="middle">Make the hero fall and land</text></g><g class="c-amber"><rect x="370" y="184" width="330" height="50" rx="8"/><text class="th" x="382" y="204" text-anchor="start">WithForces</text><text class="ts" x="382" y="223" text-anchor="start">Mixin that applies forces every tick</text></g><g class="c-amber"><rect x="370" y="242" width="330" height="50" rx="8"/><text class="th" x="382" y="262" text-anchor="start">forces.setGravity</text><text class="ts" x="382" y="281" text-anchor="start">Vector2(0, 300) pulls the hero down</text></g><g class="c-blue"><rect x="720" y="108" width="330" height="46" rx="8"/><text class="th" x="885" y="128" text-anchor="middle">Lesson 3: Apply Collision to Player</text><text class="ts" x="885" y="147" text-anchor="middle">Give the hero a solid shape</text></g><g class="c-amber"><rect x="720" y="184" width="330" height="50" rx="8"/><text class="th" x="732" y="204" text-anchor="start">RectangleHitbox</text><text class="ts" x="732" y="223" text-anchor="start">The hero's rectangular collision area</text></g><g class="c-blue"><rect x="20" y="380" width="330" height="46" rx="8"/><text class="th" x="185" y="400" text-anchor="middle">Lesson 4: Move and Jump</text><text class="ts" x="185" y="419" text-anchor="middle">A/D to walk, Space to double jump</text></g><g class="c-amber"><rect x="20" y="456" width="330" height="50" rx="8"/><text class="th" x="32" y="476" text-anchor="start">Move and Jump</text><text class="ts" x="32" y="495" text-anchor="start">A/D walk, Space jumps, countJumps = 2</text></g><g class="c-amber"><rect x="20" y="514" width="330" height="50" rx="8"/><text class="th" x="32" y="534" text-anchor="start">KeyDownEvent and KeyUpEvent</text><text class="ts" x="32" y="553" text-anchor="start">Key pressed vs. released in onKeyboard</text></g><g class="c-blue"><rect x="370" y="380" width="330" height="46" rx="8"/><text class="th" x="535" y="400" text-anchor="middle">Lesson 5: Map Boundaries for Player</text><text class="ts" x="535" y="419" text-anchor="middle">Keep the hero on the map</text></g><g class="c-amber"><rect x="370" y="456" width="330" height="50" rx="8"/><text class="th" x="382" y="476" text-anchor="start">Map Boundaries</text><text class="ts" x="382" y="495" text-anchor="start">Stop the player from leaving the map</text></g><g class="c-blue"><rect x="720" y="380" width="330" height="46" rx="8"/><text class="th" x="885" y="400" text-anchor="middle">Lesson 6: Player Attack System</text><text class="ts" x="885" y="419" text-anchor="middle">Melee on S, projectile on W</text></g><g class="c-amber"><rect x="720" y="456" width="330" height="50" rx="8"/><text class="th" x="732" y="476" text-anchor="start">Melee Attack (attack.melee)</text><text class="ts" x="732" y="495" text-anchor="start">Short-lived damage area beside the hero</text></g><g class="c-amber"><rect x="720" y="514" width="330" height="50" rx="8"/><text class="th" x="732" y="534" text-anchor="start">Ranged Attack (attack.range)</text><text class="ts" x="732" y="553" text-anchor="start">Projectile that hits the first enemy</text></g><g class="c-amber"><rect x="720" y="572" width="330" height="50" rx="8"/><text class="th" x="732" y="592" text-anchor="start">playOnceOther</text><text class="ts" x="732" y="611" text-anchor="start">Plays an attack animation once</text></g><g class="c-amber"><rect x="720" y="630" width="330" height="50" rx="8"/><text class="th" x="732" y="650" text-anchor="start">Release Frame</text><text class="ts" x="732" y="669" text-anchor="start">Fires the projectile on the cast frame</text></g><g class="c-green"><rect x="20" y="744" width="330" height="50" rx="8"/><text class="th" x="185" y="764" text-anchor="middle">Sprite Animations</text><text class="ts" x="185" y="783" text-anchor="middle">Idle, walking and action animations</text></g><g class="c-green"><rect x="370" y="744" width="330" height="50" rx="8"/><text class="th" x="535" y="764" text-anchor="middle">Fluid Controls</text><text class="ts" x="535" y="783" text-anchor="middle">A/D move, Space double jump, W/S attack</text></g><g class="c-green"><rect x="720" y="744" width="330" height="50" rx="8"/><text class="th" x="885" y="764" text-anchor="middle">Target Tracking</text><text class="ts" x="885" y="783" text-anchor="middle">Camera follows the player</text></g><g class="c-green"><rect x="195" y="802" width="330" height="50" rx="8"/><text class="th" x="360" y="822" text-anchor="middle">Collision Hitbox</text><text class="ts" x="360" y="841" text-anchor="middle">Hitboxes that meet map obstacles</text></g><g class="c-green"><rect x="545" y="802" width="330" height="50" rx="8"/><text class="th" x="710" y="822" text-anchor="middle">Combat Ready</text><text class="ts" x="710" y="841" text-anchor="middle">A melee strike and a projectile attack</text></g></svg>