<svg viewBox="0 0 1070 912" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="475" y1="82" x2="185" y2="106" marker-end="url(#ah)"/><line class="arr" x1="535" y1="82" x2="535" y2="106" marker-end="url(#ah)"/><line class="arr" x1="595" y1="82" x2="885" y2="106" marker-end="url(#ah)"/><line class="arr" x1="535" y1="720" x2="535" y2="754" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="th" x="535" y="22" text-anchor="middle">Module 4: Player (badge: HERO CONTROLLER)</text><text class="ts" x="20" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="720" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="20" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="720" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="662" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="535" y="772" text-anchor="middle">WHAT STUDENTS FINISH WITH</text><g class="c-amber"><rect x="410" y="38" width="250" height="44" rx="8"/><text class="th" x="535" y="58" text-anchor="middle">Player</text><text class="ts" x="535" y="77" text-anchor="middle">Build and control the hero</text></g><g class="c-blue"><rect x="20" y="108" width="330" height="46" rx="8"/><text class="th" x="185" y="128" text-anchor="middle">Lesson 1: Creating the Player Component</text><text class="ts" x="185" y="147" text-anchor="middle">An animated side-scroller hero</text></g><g class="c-amber"><rect x="20" y="184" width="330" height="50" rx="8"/><text class="th" x="32" y="204" text-anchor="start">PlatformPlayer</text><text class="ts" x="32" y="223" text-anchor="start">Side-scroller player: walks, jumps, animates</text></g><g class="c-amber"><rect x="20" y="242" width="330" height="50" rx="8"/><text class="th" x="32" y="262" text-anchor="start">CharacterAsset</text><text class="ts" x="32" y="281" text-anchor="start">One value picks every sprite for a character</text></g><g class="c-amber"><rect x="20" y="300" width="330" height="50" rx="8"/><text class="th" x="32" y="320" text-anchor="start">SpriteAnimation</text><text class="ts" x="32" y="339" text-anchor="start">A sheet sliced into frames played in order</text></g><g class="c-blue"><rect x="370" y="108" width="330" height="46" rx="8"/><text class="th" x="535" y="128" text-anchor="middle">Lesson 2: Apply Gravity to Player</text><text class="ts" x="535" y="147" text-anchor="middle">Make the hero fall</text></g><g class="c-amber"><rect x="370" y="184" width="330" height="50" rx="8"/><text class="th" x="382" y="204" text-anchor="start">WithForces</text><text class="ts" x="382" y="223" text-anchor="start">Lets gravity act on the hero every tick</text></g><g class="c-amber"><rect x="370" y="242" width="330" height="50" rx="8"/><text class="th" x="382" y="262" text-anchor="start">globalForces</text><text class="ts" x="382" y="281" text-anchor="start">Gravity for the whole game, set once</text></g><g class="c-blue"><rect x="720" y="108" width="330" height="46" rx="8"/><text class="th" x="885" y="128" text-anchor="middle">Lesson 3: Apply Collision to Player</text><text class="ts" x="885" y="147" text-anchor="middle">Land on the ground, not through it</text></g><g class="c-amber"><rect x="720" y="184" width="330" height="50" rx="8"/><text class="th" x="732" y="204" text-anchor="start">RectangleHitbox</text><text class="ts" x="732" y="223" text-anchor="start">The hero's solid shape</text></g><g class="c-blue"><rect x="20" y="380" width="330" height="46" rx="8"/><text class="th" x="185" y="400" text-anchor="middle">Lesson 4: Move and Jump</text><text class="ts" x="185" y="419" text-anchor="middle">A/D to walk, Space to double jump</text></g><g class="c-amber"><rect x="20" y="456" width="330" height="50" rx="8"/><text class="th" x="32" y="476" text-anchor="start">Move and Jump</text><text class="ts" x="32" y="495" text-anchor="start">A and D walk, Space jumps, twice in mid-air</text></g><g class="c-amber"><rect x="20" y="514" width="330" height="50" rx="8"/><text class="th" x="32" y="534" text-anchor="start">KeyDownEvent and KeyUpEvent</text><text class="ts" x="32" y="553" text-anchor="start">A key was pressed, or a key was let go</text></g><g class="c-blue"><rect x="370" y="380" width="330" height="46" rx="8"/><text class="th" x="535" y="400" text-anchor="middle">Lesson 5: Map Boundaries for Player</text><text class="ts" x="535" y="419" text-anchor="middle">Keep the hero on the map</text></g><g class="c-amber"><rect x="370" y="456" width="330" height="50" rx="8"/><text class="th" x="382" y="476" text-anchor="start">ScreenBoundaryChecker</text><text class="ts" x="382" y="495" text-anchor="start">Keeps the hero inside the map</text></g><g class="c-blue"><rect x="720" y="380" width="330" height="46" rx="8"/><text class="th" x="885" y="400" text-anchor="middle">Lesson 6: Player Attack (Melee)</text><text class="ts" x="885" y="419" text-anchor="middle">A close-range strike</text></g><g class="c-amber"><rect x="720" y="456" width="330" height="50" rx="8"/><text class="th" x="732" y="476" text-anchor="start">attack.melee</text><text class="ts" x="732" y="495" text-anchor="start">A short, invisible hit area beside the hero</text></g><g class="c-amber"><rect x="720" y="514" width="330" height="50" rx="8"/><text class="th" x="732" y="534" text-anchor="start">playOnceOther</text><text class="ts" x="732" y="553" text-anchor="start">Plays an attack once, then back to idle</text></g><g class="c-blue"><rect x="370" y="594" width="330" height="46" rx="8"/><text class="th" x="535" y="614" text-anchor="middle">Lesson 7: Player Attack (Range)</text><text class="ts" x="535" y="633" text-anchor="middle">A projectile attack</text></g><g class="c-amber"><rect x="370" y="670" width="330" height="50" rx="8"/><text class="th" x="382" y="690" text-anchor="start">attack.range</text><text class="ts" x="382" y="709" text-anchor="start">Fires a projectile the way the hero faces</text></g><g class="c-green"><rect x="20" y="784" width="330" height="50" rx="8"/><text class="th" x="185" y="804" text-anchor="middle">Sprite Animations</text><text class="ts" x="185" y="823" text-anchor="middle">Idle, run and attack animations</text></g><g class="c-green"><rect x="370" y="784" width="330" height="50" rx="8"/><text class="th" x="535" y="804" text-anchor="middle">Gravity &amp; Collision</text><text class="ts" x="535" y="823" text-anchor="middle">Falls and lands on the map</text></g><g class="c-green"><rect x="720" y="784" width="330" height="50" rx="8"/><text class="th" x="885" y="804" text-anchor="middle">Fluid Controls</text><text class="ts" x="885" y="823" text-anchor="middle">A/D walk, Space double jumps</text></g><g class="c-green"><rect x="195" y="842" width="330" height="50" rx="8"/><text class="th" x="360" y="862" text-anchor="middle">Map Boundaries</text><text class="ts" x="360" y="881" text-anchor="middle">Can't walk or fall off the map</text></g><g class="c-green"><rect x="545" y="842" width="330" height="50" rx="8"/><text class="th" x="710" y="862" text-anchor="middle">Combat Ready</text><text class="ts" x="710" y="881" text-anchor="middle">A melee strike and a projectile attack</text></g></svg>