<svg viewBox="0 0 720 566" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="330" y1="82" x2="185" y2="106" marker-end="url(#ah)"/><line class="arr" x1="390" y1="82" x2="535" y2="106" marker-end="url(#ah)"/><text class="th" x="360" y="22" text-anchor="middle">Module 1: Introduction</text><text class="ts" x="20" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="176" text-anchor="start">KEY CONCEPTS</text><g class="c-amber"><rect x="235" y="38" width="250" height="44" rx="8"/><text class="th" x="360" y="58" text-anchor="middle">Introduction</text><text class="ts" x="360" y="77" text-anchor="middle">What the course is and what you need</text></g><g class="c-blue"><rect x="20" y="108" width="330" height="46" rx="8"/><text class="th" x="185" y="128" text-anchor="middle">Lesson 2: What The Course Covers</text><text class="ts" x="185" y="147" text-anchor="middle">The topics the course builds up to</text></g><g class="c-amber"><rect x="20" y="184" width="330" height="50" rx="8"/><text class="th" x="32" y="204" text-anchor="start">Cloud-First Development Setup</text><text class="ts" x="32" y="223" text-anchor="start">Codespaces: run Flutter games in the browser</text></g><g class="c-amber"><rect x="20" y="242" width="330" height="50" rx="8"/><text class="th" x="32" y="262" text-anchor="start">Tilemaps &amp; World Building</text><text class="ts" x="32" y="281" text-anchor="start">Maps, collision geometry, parallax</text></g><g class="c-amber"><rect x="20" y="300" width="330" height="50" rx="8"/><text class="th" x="32" y="320" text-anchor="start">Player Component &amp; Controls</text><text class="ts" x="32" y="339" text-anchor="start">Animated hero driven by the keyboard</text></g><g class="c-amber"><rect x="20" y="358" width="330" height="50" rx="8"/><text class="th" x="32" y="378" text-anchor="start">Collisions, Combat &amp; Mechanics</text><text class="ts" x="32" y="397" text-anchor="start">Hitboxes, attacks, life bars, enemies</text></g><g class="c-amber"><rect x="20" y="416" width="330" height="50" rx="8"/><text class="th" x="32" y="436" text-anchor="start">Game Loop, Polish &amp; Deployment</text><text class="ts" x="32" y="455" text-anchor="start">Camera, lighting, sound, exporting</text></g><g class="c-amber"><rect x="20" y="474" width="330" height="50" rx="8"/><text class="th" x="32" y="494" text-anchor="start">Every lesson is modular</text><text class="ts" x="32" y="513" text-anchor="start">Follow in order or jump to a topic</text></g><g class="c-blue"><rect x="370" y="108" width="330" height="46" rx="8"/><text class="th" x="535" y="128" text-anchor="middle">Lesson 3: What You Will Need</text><text class="ts" x="535" y="147" text-anchor="middle">Accounts and tools before you start</text></g><g class="c-amber"><rect x="370" y="184" width="330" height="50" rx="8"/><text class="th" x="382" y="204" text-anchor="start">A Free GitHub Account</text><text class="ts" x="382" y="223" text-anchor="start">Access the template and launch a Codespace</text></g><g class="c-amber"><rect x="370" y="242" width="330" height="50" rx="8"/><text class="th" x="382" y="262" text-anchor="start">A Modern Web Browser</text><text class="ts" x="382" y="281" text-anchor="start">Codespaces runs VS Code in the browser</text></g><g class="c-amber"><rect x="370" y="300" width="330" height="50" rx="8"/><text class="th" x="382" y="320" text-anchor="start">Basic Dart &amp; Flutter Familiarity</text><text class="ts" x="382" y="339" text-anchor="start">No game dev experience required</text></g><g class="c-amber"><rect x="370" y="358" width="330" height="50" rx="8"/><text class="th" x="382" y="378" text-anchor="start">Internet Connection</text><text class="ts" x="382" y="397" text-anchor="start">For Codespaces, assets and videos</text></g><g class="c-amber"><rect x="370" y="416" width="330" height="50" rx="8"/><text class="th" x="382" y="436" text-anchor="start">Local Flutter Environment (Optional)</text><text class="ts" x="382" y="455" text-anchor="start">Flutter SDK 3.19+ to work offline</text></g></svg>