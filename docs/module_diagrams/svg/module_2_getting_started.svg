<svg viewBox="0 0 1070 698" xmlns="http://www.w3.org/2000/svg"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs><style>rect{stroke-width:1.5}.th{font:600 14px sans-serif;fill:#1e1e1e}.ts{font:12px sans-serif;fill:#555}.c-amber rect{fill:#fde7c4;stroke:#d97706}.c-blue rect{fill:#dbeafe;stroke:#2563eb}.c-green rect{fill:#dcfce7;stroke:#16a34a}.arr{stroke:#555;stroke-width:1.5}</style><rect width="100%" height="100%" fill="#fff"/><line class="arr" x1="475" y1="82" x2="185" y2="106" marker-end="url(#ah)"/><line class="arr" x1="535" y1="82" x2="535" y2="106" marker-end="url(#ah)"/><line class="arr" x1="595" y1="82" x2="885" y2="106" marker-end="url(#ah)"/><line class="arr" x1="360" y1="506" x2="360" y2="540" marker-end="url(#ah)" stroke-dasharray="5 4"/><line class="arr" x1="710" y1="506" x2="710" y2="540" marker-end="url(#ah)" stroke-dasharray="5 4"/><text class="th" x="535" y="22" text-anchor="middle">Module 2: Getting Started (badge: ENVIRONMENT READY)</text><text class="ts" x="20" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="370" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="720" y="176" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="195" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="545" y="448" text-anchor="start">KEY CONCEPTS</text><text class="ts" x="535" y="558" text-anchor="middle">WHAT STUDENTS FINISH WITH</text><g class="c-amber"><rect x="410" y="38" width="250" height="44" rx="8"/><text class="th" x="535" y="58" text-anchor="middle">Getting Started</text><text class="ts" x="535" y="77" text-anchor="middle">Set up your workspace</text></g><g class="c-blue"><rect x="20" y="108" width="330" height="46" rx="8"/><text class="th" x="185" y="128" text-anchor="middle">Lesson 1: Create Account on GitHub</text><text class="ts" x="185" y="147" text-anchor="middle">Free account for the cloud workspace</text></g><g class="c-amber"><rect x="20" y="184" width="330" height="50" rx="8"/><text class="th" x="32" y="204" text-anchor="start">60 Free Codespace Hours</text><text class="ts" x="32" y="223" text-anchor="start">Per month on a 2-core cloud machine</text></g><g class="c-amber"><rect x="20" y="242" width="330" height="50" rx="8"/><text class="th" x="32" y="262" text-anchor="start">Automatic Cloud Backup</text><text class="ts" x="32" y="281" text-anchor="start">Code and map assets saved to your repo</text></g><g class="c-amber"><rect x="20" y="300" width="330" height="50" rx="8"/><text class="th" x="32" y="320" text-anchor="start">Code From Any Device</text><text class="ts" x="32" y="339" text-anchor="start">Any browser on Mac, Windows, Linux, tablet</text></g><g class="c-blue"><rect x="370" y="108" width="330" height="46" rx="8"/><text class="th" x="535" y="128" text-anchor="middle">Lesson 2: Create a Codespace</text><text class="ts" x="535" y="147" text-anchor="middle">Cloud VS Code with Flutter ready</text></g><g class="c-amber"><rect x="370" y="184" width="330" height="50" rx="8"/><text class="th" x="382" y="204" text-anchor="start">GitHub Codespaces</text><text class="ts" x="382" y="223" text-anchor="start">Full VS Code + Flutter, zero local setup</text></g><g class="c-amber"><rect x="370" y="242" width="330" height="50" rx="8"/><text class="th" x="382" y="262" text-anchor="start">First-Time Build Duration</text><text class="ts" x="382" y="281" text-anchor="start">~90 s the first time, under 5 s after</text></g><g class="c-blue"><rect x="720" y="108" width="330" height="46" rx="8"/><text class="th" x="885" y="128" text-anchor="middle">Lesson 3: Install VS Code (Optional)</text><text class="ts" x="885" y="147" text-anchor="middle">Only if you want to code locally</text></g><g class="c-amber"><rect x="720" y="184" width="330" height="50" rx="8"/><text class="th" x="732" y="204" text-anchor="start">Why is this step optional?</text><text class="ts" x="732" y="223" text-anchor="start">Your Codespace already runs VS Code</text></g><g class="c-amber"><rect x="720" y="242" width="330" height="50" rx="8"/><text class="th" x="732" y="262" text-anchor="start">Flutter extension</text><text class="ts" x="732" y="281" text-anchor="start">Debugging, run without debug, hot reload</text></g><g class="c-amber"><rect x="720" y="300" width="330" height="50" rx="8"/><text class="th" x="732" y="320" text-anchor="start">Dart extension</text><text class="ts" x="732" y="339" text-anchor="start">Highlighting, code completion, linting</text></g><g class="c-blue"><rect x="195" y="380" width="330" height="46" rx="8"/><text class="th" x="360" y="400" text-anchor="middle">Lesson 4: Project File Structure</text><text class="ts" x="360" y="419" text-anchor="middle">The files you will work in</text></g><g class="c-amber"><rect x="195" y="456" width="330" height="50" rx="8"/><text class="th" x="207" y="476" text-anchor="start">Bonfire project layout</text><text class="ts" x="207" y="495" text-anchor="start">Recommended structure, not a strict rule</text></g><g class="c-blue"><rect x="545" y="380" width="330" height="46" rx="8"/><text class="th" x="710" y="400" text-anchor="middle">Lesson 5: Run the App</text><text class="ts" x="710" y="419" text-anchor="middle">Launch the starter game</text></g><g class="c-amber"><rect x="545" y="456" width="330" height="50" rx="8"/><text class="th" x="557" y="476" text-anchor="start">The Power of Hot Reload</text><text class="ts" x="557" y="495" text-anchor="start">Save or press r to see changes instantly</text></g><g class="c-green"><rect x="195" y="570" width="330" height="50" rx="8"/><text class="th" x="360" y="590" text-anchor="middle">Developer Account</text><text class="ts" x="360" y="609" text-anchor="middle">GitHub workspace for source control</text></g><g class="c-green"><rect x="545" y="570" width="330" height="50" rx="8"/><text class="th" x="710" y="590" text-anchor="middle">Cloud Codespace</text><text class="ts" x="710" y="609" text-anchor="middle">Cloud container set up with Flutter</text></g><g class="c-green"><rect x="195" y="628" width="330" height="50" rx="8"/><text class="th" x="360" y="648" text-anchor="middle">IDE Tooling</text><text class="ts" x="360" y="667" text-anchor="middle">VS Code with Flutter and Dart tooling</text></g><g class="c-green"><rect x="545" y="628" width="330" height="50" rx="8"/><text class="th" x="710" y="648" text-anchor="middle">Project Bootstrapped</text><text class="ts" x="710" y="667" text-anchor="middle">Bonfire starter game loop running</text></g></svg>