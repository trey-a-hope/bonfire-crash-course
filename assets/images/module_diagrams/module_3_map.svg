<svg viewBox="0 0 720 542" width="720" height="542" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="542" fill="#ffffff"/><line x1="330" y1="82" x2="185" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="184.0,106.2 193.5,99.3 195.2,109.6" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="390" y1="82" x2="535" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="536.0,106.2 524.8,109.6 526.5,99.3" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="185" y1="350" x2="185" y2="384" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="185.0,385.1 179.8,374.6 190.2,374.6" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="535" y1="292" x2="535" y2="384" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="535.0,385.1 529.8,374.6 540.2,374.6" fill="none" stroke="#555555" stroke-width="1.5"/><text x="360" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Module 3: Map (badge: MAP ARCHITECT)</text><text x="20" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="360" y="402" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">WHAT STUDENTS FINISH WITH</text><rect x="235" y="38" width="250" height="44" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="360" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Map</text><text x="360" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Build the game world</text><rect x="20" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 1: Loading the Map</text><text x="185" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Render the Spritefusion tilemap</text><rect x="20" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">BonfireWidget</text><text x="32" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Runs the game loop, camera and physics</text><rect x="20" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WorldMapBySpritefusion</text><text x="32" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Reads map.json: floor tiles + collision grid</text><rect x="20" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">CameraConfig</text><text x="32" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Zoom fit, and keeps the camera in the map</text><rect x="370" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 2: Custom Background</text><text x="535" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Add a scrolling parallax sky</text><rect x="370" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">GameBackground</text><text x="382" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Base class for ParallaxBackground</text><rect x="370" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">ParallaxComponent</text><text x="382" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Layers at different speeds give depth</text><rect x="20" y="414" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Tilemap Integration</text><text x="185" y="453" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Terrain and collision grid rendered</text><rect x="370" y="414" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="434" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Parallax Scenery</text><text x="535" y="453" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Sky and clouds scroll with depth</text><rect x="20" y="472" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Camera Boundaries</text><text x="185" y="511" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Camera clamped inside the map</text><rect x="370" y="472" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="492" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">World Physics</text><text x="535" y="511" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Collision obstacles stop falling off</text></svg>