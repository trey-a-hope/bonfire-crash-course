<svg viewBox="0 0 1070 872" width="1070" height="872" xmlns="http://www.w3.org/2000/svg"><rect width="1070" height="872" fill="#ffffff"/><line x1="475" y1="82" x2="185" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="184.0,106.1 194.0,100.0 194.9,110.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="535" y1="82" x2="535" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="535.0,107.0 529.8,96.5 540.2,96.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="595" y1="82" x2="885" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="886.0,106.1 875.1,110.5 876.0,100.0" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="360" y1="680" x2="360" y2="714" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="360.0,715.0 354.8,704.5 365.2,704.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="710" y1="680" x2="710" y2="714" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="710.0,715.0 704.8,704.5 715.2,704.5" fill="none" stroke="#555555" stroke-width="1.5"/><text x="535" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Module 5: Enemy (badge: ENEMY THWARPER)</text><text x="20" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="720" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="195" y="506" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="545" y="506" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="535" y="732" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">WHAT STUDENTS FINISH WITH</text><rect x="410" y="38" width="250" height="44" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="535" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Enemy</text><text x="535" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Add an enemy to fight</text><rect x="20" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 1: Creating the Enemy Component</text><text x="185" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A minor enemy beside the hero</text><rect x="20" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">PlatformEnemy</text><text x="32" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">The enemy twin of PlatformPlayer</text><rect x="20" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">components</text><text x="32" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">BonfireWidget's list for all but the player</text><rect x="370" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 2: Apply Behavior</text><text x="535" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Wander, then chase the hero</text><rect x="370" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">UseBehavior</text><text x="382" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Runs a list of behaviors every frame</text><rect x="370" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">BCondition</text><text x="382" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">If this, do that; otherwise, do something else</text><rect x="370" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">BSeeAndMoveToTarget</text><text x="382" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Chase the hero within 5 tiles</text><rect x="370" y="358" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="378" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">BRandomMovement</text><text x="382" y="397" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Wander at random when no one is near</text><rect x="720" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="885" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 3: Apply Lifebar</text><text x="885" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Life and a bar over each character</text><rect x="720" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WithLifeBar</text><text x="732" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Draws a life bar over a character</text><rect x="720" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">life</text><text x="732" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">How much damage a character can take</text><rect x="720" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">lifeBar.setup</text><text x="732" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Styles the life bar</text><rect x="195" y="438" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="360" y="458" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 4: Respond to Hurt</text><text x="360" y="477" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Flinch when an attack lands</text><rect x="195" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">onMount</text><text x="207" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Runs once the component joins the game</text><rect x="195" y="572" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="592" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">onReceiveDamageListener</text><text x="207" y="611" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Calls you back on every hit</text><rect x="195" y="630" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="650" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">playOnceOther</text><text x="207" y="669" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Plays the hurt animation one time</text><rect x="545" y="438" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="710" y="458" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 5: Respond to Die</text><text x="710" y="477" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Fall when life reaches 0</text><rect x="545" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">onDieListener</text><text x="557" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Calls you back when life hits 0</text><rect x="545" y="572" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="592" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">pauseBehaviors</text><text x="557" y="611" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Turns off the AI</text><rect x="545" y="630" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="650" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">removeFromParent</text><text x="557" y="669" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Takes the component out of the game</text><rect x="20" y="744" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Enemy Component</text><text x="185" y="783" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A minor enemy stands on the map</text><rect x="370" y="744" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Enemy AI</text><text x="535" y="783" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Wanders, then chases and strikes the hero</text><rect x="720" y="744" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="885" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Life Bars</text><text x="885" y="783" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Red over the enemy, green over the hero</text><rect x="195" y="802" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="822" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Hurt Reactions</text><text x="360" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A hurt animation on every hit</text><rect x="545" y="802" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="710" y="822" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Death</text><text x="710" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Death animation, then gone from the game</text></svg>