<svg viewBox="0 0 1070 930" width="1070" height="930" xmlns="http://www.w3.org/2000/svg"><rect width="1070" height="930" fill="#ffffff"/><line x1="475" y1="82" x2="185" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="184.0,106.1 194.0,100.0 194.9,110.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="535" y1="82" x2="535" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="535.0,107.0 529.8,96.5 540.2,96.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="595" y1="82" x2="885" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="886.0,106.1 875.1,110.5 876.0,100.0" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="360" y1="622" x2="360" y2="772" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="360.0,773.0 354.8,762.5 365.2,762.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="710" y1="738" x2="710" y2="772" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="710.0,773.0 704.8,762.5 715.2,762.5" fill="none" stroke="#555555" stroke-width="1.5"/><text x="535" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Module 5: NPC (Ally) (badge: COMPANION ARCHITECT)</text><text x="20" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="720" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="195" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="545" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="535" y="790" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">WHAT STUDENTS FINISH WITH</text><rect x="410" y="38" width="250" height="44" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="535" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">NPC (Ally)</text><text x="535" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Add a friendly character</text><rect x="20" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 1: Creating the Companion Component</text><text x="185" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A SimpleAlly added to the world</text><rect x="20" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Ally</text><text x="32" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">An NPC on the player's side, with life</text><rect x="20" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">SimpleAlly</text><text x="32" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">No PlatformAlly in Bonfire 4.0</text><rect x="20" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">components</text><text x="32" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Everything in the world but the player</text><rect x="370" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 2: Companion Sprite Animations</text><text x="535" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Strawberry idle and walk sheets</text><rect x="370" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">SimpleDirectionAnimation</text><text x="382" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Idle and run animations per direction</text><rect x="370" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Frame Count (amount)</text><text x="382" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Idle is 8 frames, walk is 4</text><rect x="720" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="885" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 3: Gravity and Collision</text><text x="885" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Stand on the map, stop at walls</text><rect x="720" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WithCollision</text><text x="732" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Stops moving when it hits something</text><rect x="720" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WithForces</text><text x="732" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Same gravity as the hero</text><rect x="720" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">RectangleHitbox</text><text x="732" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">The companion's solid shape</text><rect x="195" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="360" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 4: Companion Dialogue</text><text x="360" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Talk when the hero comes close</text><rect x="195" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">vision.seePlayer</text><text x="207" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Is the hero within 48 px?</text><rect x="195" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">TalkDialog and Say</text><text x="207" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Built-in dialogue box, line by line</text><rect x="195" y="572" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="592" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">pauseEngine / resumeEngine</text><text x="207" y="611" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Freeze the game while it talks</text><rect x="545" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="710" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 5: Make Berry Wave and Follow the Hero</text><text x="710" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Wave hello, then tag along</text><rect x="545" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">FollowAction and followAction</text><text x="557" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Stop, lost, left or right each tick</text><rect x="545" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">canMove, moveLeft and moveRight</text><text x="557" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Walk on the ground, wait at walls</text><rect x="545" y="572" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="592" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">onBlockMovementListener</text><text x="557" y="611" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Pass through the hero, not tiles</text><rect x="545" y="630" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="650" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">priority (draw order)</text><text x="557" y="669" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Always drawn just behind the hero</text><rect x="545" y="688" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="557" y="708" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Two waves</text><text x="557" y="727" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Hello in the portrait, goodbye in the world</text><rect x="20" y="802" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="822" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Companion Component</text><text x="185" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A SimpleAlly in the game world</text><rect x="370" y="802" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="822" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Sprite Animations</text><text x="535" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Strawberry idle and walk sheets</text><rect x="720" y="802" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="885" y="822" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Hitbox &amp; Collision</text><text x="885" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Stands on the map, stops at walls</text><rect x="195" y="860" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="880" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Dialogue &amp; Interaction</text><text x="360" y="899" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Talks once when the hero comes close</text><rect x="545" y="860" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="710" y="880" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Wave &amp; Follow</text><text x="710" y="899" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Waves hello, then follows the hero</text></svg>