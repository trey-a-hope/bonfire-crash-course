<svg viewBox="0 0 720 1148" width="720" height="1148" xmlns="http://www.w3.org/2000/svg"><rect width="720" height="1148" fill="#ffffff"/><line x1="330" y1="82" x2="185" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="184.0,106.2 193.5,99.3 195.2,109.6" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="390" y1="82" x2="535" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="536.0,106.2 524.8,109.6 526.5,99.3" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="360" y1="894" x2="360" y2="924" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="360.0,925.0 354.8,914.5 365.2,914.5" fill="none" stroke="#555555" stroke-width="1.5"/><text x="360.0" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Module 5: NPC (Ally) (badge: COMPANION ARCHITECT)</text><rect x="235" y="38" width="250" height="44" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="360" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">NPC (Ally)</text><text x="360" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Add a friendly character</text><rect x="20" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 1: Creating the Companion Component</text><text x="185" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A SimpleAlly added to the world</text><text x="20" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><rect x="20" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Ally</text><text x="32" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">An NPC on the player&#x27;s side, with life</text><rect x="20" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">SimpleAlly</text><text x="32" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">No PlatformAlly in Bonfire 4.0</text><rect x="20" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">components</text><text x="32" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Everything in the world but the player</text><rect x="370" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 2: Companion Sprite Animations</text><text x="535" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Strawberry idle and walk sheets</text><text x="370" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><rect x="370" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">SimpleDirectionAnimation</text><text x="382" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Idle and run animations per direction</text><rect x="370" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Frame Count (amount)</text><text x="382" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Idle is 8 frames, walk is 4</text><rect x="20" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 3: Gravity and Collision</text><text x="185" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Stand on the map, block the hero</text><text x="20" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><rect x="20" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WithCollision</text><text x="32" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Stops moving when it hits something</text><rect x="20" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WithForces</text><text x="32" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Same gravity as the hero</text><rect x="20" y="572" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="592" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">RectangleHitbox</text><text x="32" y="611" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">The companion&#x27;s solid shape</text><rect x="370" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 4: Companion Dialogue</text><text x="535" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Talk when the hero comes close</text><text x="370" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><rect x="370" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">vision.seePlayer</text><text x="382" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Is the hero within 48 px?</text><rect x="370" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">TalkDialog and Say</text><text x="382" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Built-in dialogue box, line by line</text><rect x="370" y="572" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="592" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">pauseEngine / resumeEngine</text><text x="382" y="611" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Freeze the game while it talks</text><rect x="195" y="652" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="360" y="672" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 5: Wave and Follow the Hero</text><text x="360" y="691" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Wave hello, then tag along</text><text x="195" y="720" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><rect x="195" y="728" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="748" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">FollowAction and followAction</text><text x="207" y="767" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Stop, lost, left or right each tick</text><rect x="195" y="786" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="806" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">canMove, moveLeft and moveRight</text><text x="207" y="825" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Walk on the ground, wait at walls</text><rect x="195" y="844" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="207" y="864" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">others and playOnceOther</text><text x="207" y="883" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Play the 6-frame wave once</text><text x="360.0" y="940" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">WHAT STUDENTS FINISH WITH</text><rect x="20" y="962" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="982" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Companion Component</text><text x="185" y="1001" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A SimpleAlly in the game world</text><rect x="370" y="962" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="982" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Sprite Animations</text><text x="535" y="1001" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Strawberry idle and walk sheets</text><rect x="20" y="1020" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="1040" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Hitbox &amp; Collision</text><text x="185" y="1059" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Stands on the map, blocks the hero</text><rect x="370" y="1020" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="1040" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Dialogue &amp; Interaction</text><text x="535" y="1059" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Talks when the hero comes close</text><rect x="195" y="1078" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="1098" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Wave &amp; Follow</text><text x="360" y="1117" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Waves hello, then follows the hero</text></svg>