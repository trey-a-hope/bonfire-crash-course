<svg viewBox="0 0 1070 912" width="1070" height="912" xmlns="http://www.w3.org/2000/svg"><rect width="1070" height="912" fill="#ffffff"/><line x1="475" y1="82" x2="185" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="184.0,106.1 194.0,100.0 194.9,110.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="535" y1="82" x2="535" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="535.0,107.0 529.8,96.5 540.2,96.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="595" y1="82" x2="885" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="886.0,106.1 875.1,110.5 876.0,100.0" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="535" y1="720" x2="535" y2="754" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="535.0,755.0 529.8,744.5 540.2,744.5" fill="none" stroke="#555555" stroke-width="1.5"/><text x="535" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Module 4: Player (badge: HERO CONTROLLER)</text><text x="20" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="720" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="20" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="720" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="662" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="535" y="772" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">WHAT STUDENTS FINISH WITH</text><rect x="410" y="38" width="250" height="44" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="535" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Player</text><text x="535" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Build and control the hero</text><rect x="20" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 1: Creating the Player Component</text><text x="185" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">An animated side-scroller hero</text><rect x="20" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">PlatformPlayer</text><text x="32" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Side-scroller player: walks, jumps, animates</text><rect x="20" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">CharacterAsset</text><text x="32" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">One value picks every sprite for a character</text><rect x="20" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">SpriteAnimation</text><text x="32" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">A sheet sliced into frames played in order</text><rect x="370" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 2: Apply Gravity to Player</text><text x="535" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Make the hero fall</text><rect x="370" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WithForces</text><text x="382" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Lets gravity act on the hero every tick</text><rect x="370" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">globalForces</text><text x="382" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Gravity for the whole game, set once</text><rect x="720" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="885" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 3: Apply Collision to Player</text><text x="885" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Land on the ground, not through it</text><rect x="720" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">RectangleHitbox</text><text x="732" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">The hero's solid shape</text><rect x="20" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 4: Move and Jump</text><text x="185" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A/D to walk, Space to double jump</text><rect x="20" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Move and Jump</text><text x="32" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">A and D walk, Space jumps, twice in mid-air</text><rect x="20" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">KeyDownEvent and KeyUpEvent</text><text x="32" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">A key was pressed, or a key was let go</text><rect x="370" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 5: Map Boundaries for Player</text><text x="535" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Keep the hero on the map</text><rect x="370" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">ScreenBoundaryChecker</text><text x="382" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Keeps the hero inside the map</text><rect x="720" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="885" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 6: Player Attack (Melee)</text><text x="885" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A close-range strike</text><rect x="720" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">attack.melee</text><text x="732" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">A short, invisible hit area beside the hero</text><rect x="720" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">playOnceOther</text><text x="732" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Plays an attack once, then back to idle</text><rect x="370" y="594" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="614" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 7: Player Attack (Range)</text><text x="535" y="633" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A projectile attack</text><rect x="370" y="670" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="690" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">attack.range</text><text x="382" y="709" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Fires a projectile the way the hero faces</text><rect x="20" y="784" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="804" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Sprite Animations</text><text x="185" y="823" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Idle, run and attack animations</text><rect x="370" y="784" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="804" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Gravity &amp; Collision</text><text x="535" y="823" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Falls and lands on the map</text><rect x="720" y="784" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="885" y="804" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Fluid Controls</text><text x="885" y="823" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A/D walk, Space double jumps</text><rect x="195" y="842" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="862" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Map Boundaries</text><text x="360" y="881" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Can't walk or fall off the map</text><rect x="545" y="842" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="710" y="862" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Combat Ready</text><text x="710" y="881" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A melee strike and a projectile attack</text></svg>