<svg viewBox="0 0 1070 872" width="1070" height="872" xmlns="http://www.w3.org/2000/svg"><rect width="1070" height="872" fill="#ffffff"/><line x1="475" y1="82" x2="185" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="184.0,106.1 194.0,100.0 194.9,110.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="535" y1="82" x2="535" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="535.0,107.0 529.8,96.5 540.2,96.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="595" y1="82" x2="885" y2="106" stroke="#555555" stroke-width="1.5"/><polygon points="886.0,106.1 875.1,110.5 876.0,100.0" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="185" y1="564" x2="185" y2="714" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="185.0,715.0 179.8,704.5 190.2,704.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="535" y1="506" x2="535" y2="714" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="535.0,715.0 529.8,704.5 540.2,704.5" fill="none" stroke="#555555" stroke-width="1.5"/><line x1="885" y1="680" x2="885" y2="714" stroke="#555555" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="885.0,715.0 879.8,704.5 890.2,704.5" fill="none" stroke="#555555" stroke-width="1.5"/><text x="535" y="22" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Module 4: Player (badge: HERO CONTROLLER)</text><text x="20" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="720" y="176" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="20" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="370" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="720" y="448" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">KEY CONCEPTS</text><text x="535" y="732" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">WHAT STUDENTS FINISH WITH</text><rect x="410" y="38" width="250" height="44" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="535" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Player</text><text x="535" y="77" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Build and control the hero</text><rect x="20" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 1: Creating the Player Component</text><text x="185" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">An animated side-scroller hero</text><rect x="20" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">PlatformPlayer</text><text x="32" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Side-scroller hero: run, jump, face a side</text><rect x="20" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">CharacterAsset</text><text x="32" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">One enum holds a character's sprite paths</text><rect x="20" y="300" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="320" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">SpriteAnimation</text><text x="32" y="339" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Sheet frames in order; stepTime sets speed</text><rect x="370" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 2: Apply Gravity to Player</text><text x="535" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Make the hero fall and land</text><rect x="370" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">WithForces</text><text x="382" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Mixin that applies forces every tick</text><rect x="370" y="242" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="262" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">forces.setGravity</text><text x="382" y="281" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Vector2(0, 300) pulls the hero down</text><rect x="720" y="108" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="885" y="128" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 3: Apply Collision to Player</text><text x="885" y="147" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Give the hero a solid shape</text><rect x="720" y="184" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="204" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">RectangleHitbox</text><text x="732" y="223" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">The hero's rectangular collision area</text><rect x="20" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="185" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 4: Move and Jump</text><text x="185" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A/D to walk, Space to double jump</text><rect x="20" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Move and Jump</text><text x="32" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">A/D walk, Space jumps, countJumps = 2</text><rect x="20" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="32" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">KeyDownEvent and KeyUpEvent</text><text x="32" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Key pressed vs. released in onKeyboard</text><rect x="370" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="535" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 5: Map Boundaries for Player</text><text x="535" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Keep the hero on the map</text><rect x="370" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="382" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Map Boundaries</text><text x="382" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Stop the player from leaving the map</text><rect x="720" y="380" width="330" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="885" y="400" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Lesson 6: Player Attack System</text><text x="885" y="419" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Melee on S, projectile on W</text><rect x="720" y="456" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="476" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Melee Attack (attack.melee)</text><text x="732" y="495" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Short-lived damage area beside the hero</text><rect x="720" y="514" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="534" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Ranged Attack (attack.range)</text><text x="732" y="553" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Projectile that hits the first enemy</text><rect x="720" y="572" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="592" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">playOnceOther</text><text x="732" y="611" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Plays an attack animation once</text><rect x="720" y="630" width="330" height="50" rx="8" fill="#fde7c4" stroke="#d97706" stroke-width="1.5"/><text x="732" y="650" text-anchor="start" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Release Frame</text><text x="732" y="669" text-anchor="start" font-family="sans-serif" font-size="12" fill="#555555">Fires the projectile on the cast frame</text><rect x="20" y="744" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="185" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Sprite Animations</text><text x="185" y="783" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Idle, walking and action animations</text><rect x="370" y="744" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="535" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Fluid Controls</text><text x="535" y="783" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A/D move, Space double jump, W/S attack</text><rect x="720" y="744" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="885" y="764" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Target Tracking</text><text x="885" y="783" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Camera follows the player</text><rect x="195" y="802" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="360" y="822" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Collision Hitbox</text><text x="360" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Hitboxes that meet map obstacles</text><rect x="545" y="802" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="710" y="822" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="600" fill="#1e1e1e">Combat Ready</text><text x="710" y="841" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">A melee strike and a projectile attack</text></svg>